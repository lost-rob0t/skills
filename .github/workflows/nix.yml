name: Nix

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install pinned validator runner
        run: python3 -m pip install --disable-pip-version-check 'uv==0.12.0'
      - name: Validate every canonical skill
        run: bash scripts/validate-skills
      - name: Validate support scripts
        run: bash scripts/validate-support-scripts
      - name: Reject unknown skill frontmatter
        run: |
          set -euo pipefail
          if output="$(bash scripts/validate-skills tests/fixtures/unknown-frontmatter 2>&1)"; then
            echo 'expected unknown-frontmatter fixture to fail validation' >&2
            exit 1
          fi
          printf '%s\n' "$output"
          grep -Fq 'Unexpected fields in frontmatter: unexpected-key' <<<"$output"
      - name: Test Task Steward bootstrap adapter
        run: python3 -m unittest tests/test_task_steward_bootstrap.py -v
      - name: Test skill support scripts and workflow discovery
        run: python3 -m unittest tests/test_support_scripts.py tests/test_system_resource_skills.py tests/test_discover_workflows.py tests/test_git_worktrees.py tests/test_prolog_verification.py tests/test_status_update.py tests/test_youtube_context.py -v
      - name: Validate flake metadata
        run: nix flake metadata
      - name: Verify exported canonical skill names
        run: |
          set -euo pipefail
          expected='["activitywatch-analyze","activitywatch-group","activitywatch-productivity","activitywatch-visualize","adadr","debug-system","discover-workflows","dotfiles-workflow","forgejo-repo-bootstrap","forgejo-skill-edit","free-resources","git","git-worktrees","impeccable","ponytail","ponytail-audit","ponytail-debt","ponytail-gain","ponytail-help","ponytail-review","prolog-project-kb","prolog-reasoning","prolog-verification","qtile-confirm","qtile-debug","qtile-edit","qtile-reload","rage","skill-edit","skill-portability","spec","star-lang","starintel-actor-create","starintel-auto-dig","starintel-document-create","starintel-ingest","starintel-local-search","starintel-osint","starintel-repo-bootstrap","starintel-wearos-release","status-update","sudo","task-steward-bootstrap","task-steward-worker","youtube-context","zara-mcp"]'
          agent_zero_expected='["activitywatch-analyze","activitywatch-group","activitywatch-productivity","activitywatch-visualize","adadr","debug-system","discover-workflows","dotfiles-workflow","free-resources","git","git-worktrees","impeccable","ponytail","ponytail-audit","ponytail-debt","ponytail-gain","ponytail-help","ponytail-review","prolog-project-kb","prolog-reasoning","prolog-verification","qtile-confirm","qtile-debug","qtile-edit","qtile-reload","rage","skill-edit","skill-portability","spec","star-lang","starintel-actor-create","starintel-auto-dig","starintel-document-create","starintel-ingest","starintel-local-search","starintel-osint","starintel-repo-bootstrap","starintel-wearos-release","status-update","sudo","task-steward-bootstrap","task-steward-worker","youtube-context","zara-mcp"]'
          test "$(nix eval --json .#lib.skillNames)" = "$expected"
          test "$(nix eval --json .#lib.opencodeSkillNames)" = "$expected"
          test "$(nix eval --json .#lib.agentZeroSkillNames)" = "$agent_zero_expected"
      - name: Verify Agent Zero is GitHub-only
        run: |
          set -euo pipefail
          test "$(nix eval --json .#lib.adapters.agent-zero.skills --apply builtins.attrNames)" = "$(nix eval --json .#lib.agentZeroSkillNames)"
          ! nix eval --json .#lib.adapters.agent-zero.skills.forgejo-repo-bootstrap >/dev/null 2>&1
          ! nix eval --json .#lib.adapters.agent-zero.skills.forgejo-skill-edit >/dev/null 2>&1
          grep -Fq 'github.com' skills/git/SKILL.md
          grep -Fq 'GitHub as the only remote hosting control plane' skills/git/SKILL.md
      - name: Verify canonical skill packages
        run: |
          set -euo pipefail
          test -f skills/activitywatch-analyze/SKILL.md
          test -f skills/activitywatch-group/SKILL.md
          test -f skills/activitywatch-productivity/SKILL.md
          test -f skills/activitywatch-visualize/SKILL.md
          test -f skills/adadr/SKILL.md
          test -f skills/debug-system/SKILL.md
          test -f skills/discover-workflows/SKILL.md
          test -f skills/dotfiles-workflow/SKILL.md
          test -f skills/forgejo-repo-bootstrap/SKILL.md
          test -f skills/forgejo-skill-edit/SKILL.md
          test -f skills/free-resources/SKILL.md
          test -f skills/git/SKILL.md
          test -f skills/git-worktrees/SKILL.md
          test -f skills/impeccable/SKILL.md
          test -f skills/ponytail/SKILL.md
          test -f skills/ponytail-audit/SKILL.md
          test -f skills/ponytail-debt/SKILL.md
          test -f skills/ponytail-gain/SKILL.md
          test -f skills/ponytail-help/SKILL.md
          test -f skills/ponytail-review/SKILL.md
          test -f skills/prolog-project-kb/SKILL.md
          test -f skills/prolog-reasoning/SKILL.md
          test -f skills/prolog-verification/SKILL.md
          test -f skills/qtile-confirm/SKILL.md
          test -f skills/qtile-debug/SKILL.md
          test -f skills/qtile-edit/SKILL.md
          test -f skills/qtile-reload/SKILL.md
          test -f skills/rage/SKILL.md
          test -f skills/skill-edit/SKILL.md
          test -f skills/skill-portability/SKILL.md
          test -f skills/spec/SKILL.md
          test -f skills/star-lang/SKILL.md
          test -f skills/starintel-actor-create/SKILL.md
          test -f skills/starintel-auto-dig/SKILL.md
          test -f skills/starintel-document-create/SKILL.md
          test -f skills/starintel-ingest/SKILL.md
          test -f skills/starintel-local-search/SKILL.md
          test -f skills/starintel-osint/SKILL.md
          test -f skills/starintel-repo-bootstrap/SKILL.md
          test -f skills/starintel-wearos-release/SKILL.md
          test -f skills/status-update/SKILL.md
          test -f skills/sudo/SKILL.md
          test -f skills/task-steward-bootstrap/SKILL.md
          test -f skills/task-steward-worker/SKILL.md
          test -f skills/youtube-context/SKILL.md
          test -f skills/zara-mcp/SKILL.md
      - name: Verify adapter metadata
        run: |
          set -euo pipefail
          test "$(nix eval --raw .#lib.targets.opencode)" = '.config/opencode/skills'
          test "$(nix eval --raw .#lib.targets.claude)" = '.claude/skills'
          test "$(nix eval --raw .#lib.targets.agents)" = '.agents/skills'
          test "$(nix eval --raw .#lib.targets.codex)" = '.codex/skills'
          test "$(nix eval --raw .#lib.targets.cursor)" = '.cursor/skills'
          test "$(nix eval --raw .#lib.targets.copilot)" = '.copilot/skills'
          test "$(nix eval --raw .#lib.targets.agent-zero)" = 'usr/skills'
