name: Nix

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Validate flake metadata
        run: nix flake metadata
      - name: Verify exported canonical skill names
        run: |
          set -euo pipefail
          expected='["dotfiles-workflow","prolog-reasoning","rage","skill-portability","spec","star-lang","starintel-actor-create","starintel-auto-dig","starintel-document-create","starintel-ingest","starintel-local-search","starintel-osint","zara-mcp"]'
          test "$(nix eval --json .#lib.skillNames)" = "$expected"
          test "$(nix eval --json .#lib.opencodeSkillNames)" = "$expected"
      - name: Verify canonical skill packages
        run: |
          set -euo pipefail
          test -f skills/dotfiles-workflow/SKILL.md
          test -f skills/prolog-reasoning/SKILL.md
          test -f skills/rage/SKILL.md
          test -f skills/skill-portability/SKILL.md
          test -f skills/spec/SKILL.md
          test -f skills/star-lang/SKILL.md
          test -f skills/starintel-actor-create/SKILL.md
          test -f skills/starintel-auto-dig/SKILL.md
          test -f skills/starintel-document-create/SKILL.md
          test -f skills/starintel-ingest/SKILL.md
          test -f skills/starintel-local-search/SKILL.md
          test -f skills/starintel-osint/SKILL.md
          test -f skills/zara-mcp/SKILL.md
      - name: Verify adapter metadata
        run: |
          set -euo pipefail
          test "$(nix eval --raw .#lib.targets.opencode)" = '.config/opencode/skills'
          test "$(nix eval --raw .#lib.targets.claude)" = '.claude/skills'
          test "$(nix eval --raw .#lib.targets.agents)" = '.agents/skills'
          test "$(nix eval --raw .#lib.targets.codex)" = '.codex/skills'
          test "$(nix eval --raw .#lib.targets.cursor)" = '.cursor/skills'
          test "$(nix eval --raw .#lib.targets.copilot)" = '.copilot/skills'
          test "$(nix eval --raw .#lib.targets.agent-zero)" = 'usr/skills'
